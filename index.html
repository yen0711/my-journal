<style>
  :root{
    --bg:#EDECEA;
    --surface:#FAF9F6;
    --surface-2:#F1EFEB;
    --ink:#2B2A2E;
    --muted:#787580;
    --faint:#AAA6B0;
    --line:#E2DFD9;
    --accent:#6E6FA0;
    --accent-ink:#585990;
    --accent-soft:rgba(110,111,160,.12);
    --shadow:0 1px 2px rgba(40,38,50,.04), 0 8px 26px rgba(40,38,50,.06);
    --shadow-lift:0 2px 6px rgba(40,38,50,.06), 0 14px 40px rgba(40,38,50,.10);
    --serif:'Noto Serif TC','Songti TC',serif;
    --sans:'Noto Sans TC',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --r:16px;
    --r-sm:11px;
  }
  [data-theme="dark"]{
    --bg:#141520;
    --surface:#1D1E2A;
    --surface-2:#23242F;
    --ink:#E9E7EE;
    --muted:#9895A6;
    --faint:#6C697C;
    --line:#2C2D3B;
    --accent:#A2A3DC;
    --accent-ink:#BCBDEC;
    --accent-soft:rgba(162,163,220,.15);
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35);
    --shadow-lift:0 2px 6px rgba(0,0,0,.3), 0 16px 44px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);line-height:1.7;
    -webkit-font-smoothing:antialiased;
    transition:background .5s ease,color .5s ease;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent-ink);}

  .wrap{max-width:720px;margin:0 auto;padding:0 20px 120px;}

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky;top:0;z-index:40;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:720px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{position:relative;display:flex;flex-direction:column;line-height:1;user-select:none;}
  .brand-name{
    font-family:var(--serif);font-weight:500;font-size:1.28rem;letter-spacing:.14em;
    color:var(--ink);
  }
  .brand-name .dot{color:var(--accent);}
  .brand-reflect{
    font-family:var(--serif);font-weight:500;font-size:1.28rem;letter-spacing:.14em;
    color:var(--accent);position:absolute;top:1.15em;left:0;
    transform:scaleY(-1);opacity:.16;pointer-events:none;
    -webkit-mask-image:linear-gradient(to bottom,#000,transparent 70%);
    mask-image:linear-gradient(to bottom,#000,transparent 70%);
  }
  .brand-sub{
    font-size:.62rem;letter-spacing:.28em;color:var(--faint);margin-top:.5em;
    text-transform:uppercase;
  }
  .toolbtns{display:flex;gap:6px;align-items:center;}
  .iconbtn{
    display:grid;place-items:center;width:38px;height:38px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);
    cursor:pointer;transition:.18s;flex-shrink:0;
  }
  .iconbtn:hover{color:var(--accent-ink);border-color:var(--accent);transform:translateY(-1px);}
  .iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .iconbtn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  /* ---------- 備份提醒 ---------- */
  .backup-note{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));
    border-radius:var(--r);padding:12px 15px;font-size:.85rem;color:var(--ink);line-height:1.5;
  }
  .backup-note .bn-ico{width:20px;height:20px;stroke:var(--accent-ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .backup-note #backupNoteText{flex:1;min-width:140px;}
  .backup-note .bn-actions{display:flex;gap:6px;align-items:center;margin-left:auto;}
  .bn-primary{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:7px 15px;font-size:.82rem;cursor:pointer;transition:.15s;font-family:var(--sans);}
  .bn-primary:hover{filter:brightness(1.06);}
  .bn-ghost{background:none;border:none;color:var(--muted);font-size:.82rem;cursor:pointer;padding:7px 8px;border-radius:9px;font-family:var(--sans);}
  .bn-ghost:hover{color:var(--ink);}

  /* ---------- 頁面容器 ---------- */
  .page{display:none;}
  .page.active{display:block;animation:pagein .32s ease both;}
  @keyframes pagein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ---------- 撰寫浮動鈕（日記頁） ---------- */
  .fab{
    position:fixed;right:24px;bottom:26px;z-index:50;width:58px;height:58px;border-radius:50%;
    border:none;background:var(--accent);color:#fff;cursor:pointer;
    display:grid;place-items:center;transition:transform .25s,box-shadow .2s,opacity .25s;
    box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent);
  }
  .fab svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;}
  .fab:hover{transform:translateY(-2px) scale(1.05);}
  .fab:active{transform:scale(.96);}
  .fab.hidden{transform:translateY(150%);opacity:0;pointer-events:none;}

  /* ---------- 撰寫頁：返回按鈕 ---------- */
  #page-write .composer{margin-top:12px;}
  .write-top{display:flex;align-items:center;margin-top:22px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:3px;font-family:var(--sans);font-size:.88rem;
    color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 6px 6px 2px;border-radius:9px;transition:.15s;
  }
  .back-btn:hover{color:var(--accent-ink);}
  .back-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- Composer ---------- */
  .composer{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);margin-top:26px;overflow:hidden;
  }
  .tabs{display:flex;gap:2px;padding:10px 12px 0;}
  .tab{
    font-size:.82rem;color:var(--muted);background:none;border:none;cursor:pointer;
    padding:7px 14px;border-radius:9px 9px 0 0;font-family:var(--sans);transition:.15s;
  }
  .tab.active{color:var(--accent-ink);background:var(--surface-2);font-weight:500;}
  .tab:hover:not(.active){color:var(--ink);}

  .composer-body{padding:6px 18px 4px;}
  textarea#editor{
    width:100%;border:none;background:transparent;resize:none;outline:none;
    font-family:var(--serif);font-size:1.06rem;line-height:1.8;color:var(--ink);
    min-height:104px;padding:12px 0 4px;
  }
  textarea#editor::placeholder{color:var(--faint);}
  #preview{
    min-height:104px;padding:12px 0 4px;font-family:var(--serif);font-size:1.06rem;
    line-height:1.85;color:var(--ink);display:none;
  }
  #preview.empty{color:var(--faint);}

  .media-strip{display:flex;flex-wrap:wrap;gap:10px;padding:2px 0 8px;}
  .media-thumb{
    position:relative;width:88px;height:88px;border-radius:var(--r-sm);overflow:hidden;
    border:1px solid var(--line);background:var(--surface-2);flex-shrink:0;
  }
  .media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .media-thumb .file-badge{
    width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;padding:6px;text-align:center;color:var(--muted);
  }
  .media-thumb .file-badge span{font-size:.58rem;line-height:1.25;word-break:break-all;max-height:2.5em;overflow:hidden;}
  .media-thumb .rm{
    position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
    background:rgba(20,20,30,.62);color:#fff;border:none;cursor:pointer;display:grid;
    place-items:center;font-size:13px;line-height:1;backdrop-filter:blur(4px);
  }
  .media-thumb .rm:hover{background:rgba(20,20,30,.85);}

  .composer-foot{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 18px 16px;border-top:1px solid var(--line);margin-top:6px;
  }
  .foot-left{display:flex;align-items:center;gap:6px;}
  .attach{
    display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;transition:.16s;
  }
  .attach:hover{color:var(--accent-ink);border-color:var(--accent);}
  .attach svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .draft-note{font-size:.72rem;color:var(--faint);letter-spacing:.02em;transition:.3s;}
  .draft-note b{color:var(--accent-ink);font-weight:500;}

  .btn-primary{
    font-family:var(--sans);font-size:.9rem;font-weight:500;letter-spacing:.05em;
    color:#fff;background:var(--accent);border:none;border-radius:11px;
    padding:10px 24px;cursor:pointer;transition:.18s;box-shadow:0 4px 14px var(--accent-soft);
  }
  [data-theme="dark"] .btn-primary{color:#16171f;}
  .btn-primary:hover{background:var(--accent-ink);transform:translateY(-1px);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-ghost{
    font-family:var(--sans);font-size:.82rem;color:var(--muted);background:none;
    border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.16s;
  }
  .btn-ghost:hover{color:var(--accent-ink);border-color:var(--accent);}

  /* ---------- Filter ---------- */
  .filterbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:30px 2px 8px;
  }
  .filterbar .fb-label{font-size:.72rem;letter-spacing:.24em;color:var(--faint);text-transform:uppercase;}
  .filterbar input[type="date"],.filterbar select{
    font-family:var(--sans);font-size:.82rem;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;
    transition:.16s;color-scheme:light;
  }
  [data-theme="dark"] .filterbar input[type="date"],[data-theme="dark"] .filterbar select{color-scheme:dark;}
  .filterbar input[type="date"]:hover,.filterbar select:hover{border-color:var(--accent);}
  .filter-count{font-size:.74rem;color:var(--muted);margin-left:auto;}

  /* ---------- 分類 ---------- */
  .composer-cats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 2px 2px;}
  .composer-cats .cc-label{font-size:.7rem;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;flex-shrink:0;}
  .cat-choices{display:flex;gap:6px;flex-wrap:wrap;}
  .cat-pill{
    display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:.76rem;line-height:1;
    color:var(--muted);background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;cursor:pointer;transition:.15s;
  }
  .cat-pill i{width:8px;height:8px;border-radius:50%;background:var(--cc,var(--faint));flex-shrink:0;}
  .cat-pill:hover{border-color:var(--cc,var(--accent));color:var(--ink);}
  .cat-pill.on{color:var(--cc,var(--accent-ink));background:color-mix(in srgb,var(--cc,var(--accent)) 15%,var(--surface));border-color:var(--cc,var(--accent));}
  .cat-pill.add{color:var(--faint);border-style:dashed;}
  .cat-pill.add:hover{color:var(--accent-ink);border-color:var(--accent);}

  .catbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 2px 0;}
  .cat-chip{
    display:inline-flex;align-items:center;gap:6px;font-size:.77rem;line-height:1;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
    cursor:pointer;transition:.15s;
  }
  .cat-chip i{width:7px;height:7px;border-radius:50%;background:var(--cc,var(--faint));}
  .cat-chip:hover{border-color:var(--cc,var(--accent));color:var(--ink);}
  .cat-chip.on{color:var(--cc,var(--accent-ink));background:color-mix(in srgb,var(--cc,var(--accent)) 14%,var(--surface));border-color:var(--cc,var(--accent));font-weight:500;}

  .post-head-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;}
  .post-cat{
    display:inline-flex;align-items:center;gap:5px;font-size:.71rem;line-height:1;white-space:nowrap;
    color:var(--cc,var(--muted));background:color-mix(in srgb,var(--cc,var(--accent)) 13%,transparent);
    border-radius:999px;padding:3px 9px;
  }
  .post-cat i{width:6px;height:6px;border-radius:50%;background:var(--cc,var(--faint));}

  /* ---------- Feed timeline ---------- */
  .feed{position:relative;margin-top:22px;padding-left:26px;}
  .feed::before{
    content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;
    background:linear-gradient(to bottom,var(--line),var(--line) 88%,transparent);
  }
  .post{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:22px;
    transition:box-shadow .25s,transform .25s,border-color .25s;
    animation:rise .45s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .post:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));}
  .post::before{
    content:"";position:absolute;left:-25px;top:26px;width:11px;height:11px;border-radius:50%;
    background:var(--surface);border:2.5px solid var(--accent);box-shadow:0 0 0 4px var(--bg);
  }
  .post-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .post-date{font-size:.78rem;color:var(--muted);letter-spacing:.02em;display:flex;align-items:baseline;gap:8px;}
  .post-date .time{color:var(--faint);font-variant-numeric:tabular-nums;}
  .post-actions{display:flex;gap:4px;opacity:0;transition:.2s;}
  .post:hover .post-actions{opacity:1;}
  .post-actions button{
    background:none;border:none;color:var(--faint);cursor:pointer;padding:5px;border-radius:7px;
    display:grid;place-items:center;transition:.15s;
  }
  .post-actions button:hover{color:var(--accent-ink);background:var(--surface-2);}
  .post-actions svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

  .post-body{font-family:var(--serif);font-size:1.04rem;line-height:1.85;color:var(--ink);word-break:break-word;}
  .post-body p{margin:0 0 .8em;}
  .post-body p:last-child{margin-bottom:0;}
  .post-body h3,.post-body h4,.post-body h5,.post-body h6{font-weight:600;margin:1em 0 .5em;line-height:1.4;}
  .post-body h3{font-size:1.18rem;}
  .post-body h4{font-size:1.06rem;}
  .post-body h5,.post-body h6{font-size:.98rem;}
  .post-body a{text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--accent-soft);}
  .post-body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;background:var(--surface-2);padding:.12em .4em;border-radius:5px;}
  .post-body pre{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;margin:.6em 0;}
  .post-body pre code{background:none;padding:0;font-size:.85em;}
  .post-body blockquote{margin:.6em 0;padding:.2em 0 .2em 14px;border-left:3px solid var(--accent);color:var(--muted);font-style:italic;}
  .post-body ul,.post-body ol{margin:.4em 0 .8em;padding-left:1.4em;}
  .post-body li{margin:.2em 0;}
  .post-body hr{border:none;border-top:1px solid var(--line);margin:1em 0;}

  /* 貼文媒體：多張時橫向滑動，卡片不會一直往下長 */
  .post-media{
    display:flex;gap:8px;margin-top:14px;overflow-x:auto;scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;
  }
  .post-media::-webkit-scrollbar{display:none;}
  .post-media figure{
    margin:0;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);
    background:var(--surface-2);flex:0 0 auto;scroll-snap-align:start;
  }
  /* 只有一個視覺媒體：整寬顯示 */
  .post-media.single{overflow:visible;}
  .post-media.single figure{width:100%;}
  .post-media.single img{width:100%;max-height:520px;object-fit:contain;background:var(--surface-2);display:block;cursor:zoom-in;}
  .post-media.single video{width:100%;max-height:520px;background:#000;display:block;}
  /* 多個視覺媒體：固定高度的橫向底片條 */
  .post-media:not(.single) figure{width:min(78vw,340px);height:230px;}
  .post-media:not(.single) img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .post-media:not(.single) video{width:100%;height:100%;object-fit:cover;background:#000;display:block;}

  /* 音檔與其他附件（數量少，維持縱向排列） */
  .post-files{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .post-files audio{width:100%;}
  .post-files .file-link{
    display:flex;align-items:center;gap:10px;padding:12px 14px;color:var(--ink);text-decoration:none;font-size:.85rem;
    border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);
  }
  .post-files .file-link:hover{border-color:var(--accent);}
  .post-files .file-link svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.6;flex-shrink:0;}

  /* ---------- Empty ---------- */
  .empty-state{text-align:center;padding:70px 20px;color:var(--faint);}
  .empty-state .glyph{font-family:var(--serif);font-size:2.6rem;color:var(--accent);opacity:.55;margin-bottom:14px;}
  .empty-state p{margin:.3em 0;font-size:.92rem;}
  .empty-state .sub{font-size:.8rem;color:var(--faint);}

  /* ---------- 雲端同步 ---------- */
  #syncBtn{position:relative;}
  .sync-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;
    background:var(--muted);border:2px solid var(--surface);transition:.2s;opacity:.5;}
  .sync-dot.on{background:#5AA469;opacity:1;}      /* 已連結 */
  .sync-dot.syncing{background:var(--accent);opacity:1;animation:pulse 1s infinite;}
  .sync-dot.err{background:#C46B6B;opacity:1;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .modal{position:fixed;inset:0;z-index:90;background:rgba(12,12,18,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
  .modal[hidden]{display:none;}
  .modal-card{position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);box-shadow:0 24px 70px rgba(0,0,0,.3);width:100%;max-width:420px;
    padding:26px 24px 22px;animation:pagein .25s ease both;}
  .modal-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
    border:none;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.15s;}
  .modal-x:hover{background:var(--surface-2);color:var(--ink);}
  .modal-x svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
  .modal-title{font-family:var(--serif);font-size:1.2rem;margin:0 0 8px;color:var(--ink);}
  .modal-sub{font-size:.86rem;color:var(--muted);line-height:1.6;margin:0 0 16px;}
  .sync-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .modal-btn{border:none;border-radius:10px;padding:10px 18px;font-size:.88rem;cursor:pointer;font-family:var(--sans);transition:.15s;}
  .modal-btn.primary{background:var(--accent);color:#fff;}
  .modal-btn.primary:hover{filter:brightness(1.06);}
  .modal-btn.primary.small{padding:8px 14px;font-size:.82rem;margin-top:8px;}
  .modal-btn.ghost{background:var(--surface-2);color:var(--ink);}
  .modal-btn.ghost:hover{filter:brightness(.97);}
  .sync-last{font-size:.78rem;color:var(--muted);margin:6px 0 0;}
  .sync-adv{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;}
  .sync-adv summary{font-size:.84rem;color:var(--accent-ink);cursor:pointer;}
  .modal-hint{font-size:.8rem;color:var(--muted);line-height:1.6;margin:10px 0;}
  .modal-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:.82rem;font-family:var(--sans);background:var(--bg);color:var(--ink);}
  .modal-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent;}

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:80;background:rgba(12,12,18,.9);
    display:none;align-items:center;justify-content:center;padding:30px;cursor:default;
    backdrop-filter:blur(6px);touch-action:pan-y;
  }
  .lightbox.show{display:flex;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .lightbox img{max-width:100%;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:zoom-out;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  .lb-close{
    position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;z-index:2;
    background:rgba(255,255,255,.14);border:none;cursor:pointer;display:grid;place-items:center;
    backdrop-filter:blur(4px);transition:.15s;
  }
  .lb-close:hover{background:rgba(255,255,255,.28);}
  .lb-close svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;}
  .lb-back{
    position:absolute;top:16px;left:16px;width:44px;height:44px;border-radius:50%;z-index:2;
    background:rgba(255,255,255,.14);border:none;cursor:pointer;display:grid;place-items:center;
    backdrop-filter:blur(4px);transition:.15s;
  }
  .lb-back:hover{background:rgba(255,255,255,.28);}
  .lb-back svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .lb-nav{
    position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;z-index:2;
    background:rgba(255,255,255,.12);border:none;cursor:pointer;display:grid;place-items:center;
    backdrop-filter:blur(4px);transition:.15s;
  }
  .lb-nav:hover{background:rgba(255,255,255,.26);}
  .lb-nav svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .lb-prev{left:14px;} .lb-next{right:14px;}
  .lb-counter{
    position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:.85rem;
    letter-spacing:.1em;background:rgba(20,20,30,.55);padding:5px 15px;border-radius:999px;
    backdrop-filter:blur(4px);font-variant-numeric:tabular-nums;
  }
  @media(max-width:560px){
    .lightbox{padding:16px;}
    .lb-nav{width:40px;height:40px;background:rgba(255,255,255,.1);}
    .lb-prev{left:8px;} .lb-next{right:8px;}
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);font-size:.84rem;padding:11px 20px;border-radius:12px;
    box-shadow:var(--shadow-lift);z-index:90;opacity:0;pointer-events:none;transition:.3s;letter-spacing:.03em;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:560px){
    .wrap{padding:0 14px 100px;}
    .topbar-inner{padding:12px 14px;}
    .filter-count{width:100%;margin-left:0;order:5;}
    .composer-foot{flex-wrap:wrap;}
    .fab{right:16px;bottom:18px;}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brandHome" style="cursor:pointer" title="回到日記">
      <div class="brand-name">心映隨筆<span class="dot">·</span></div>
      <div class="brand-reflect" aria-hidden="true">心映隨筆·</div>
      <div class="brand-sub">Daily Journal</div>
    </div>

<script>
"use strict";
/* =========================================================
   心映隨筆 — 純前端 · IndexedDB 儲存 · GitHub Pages 可部署
   ========================================================= */

const DB_NAME = 'xinying_journal_db';
const DB_VER  = 1;
const LS_THEME = 'xy_theme';
const LS_DRAFT_TEXT = 'xy_draft_text';   // localStorage 即時暫存草稿文字
const LS_CATS = 'xy_custom_cats';        // localStorage 使用者自訂分類
const LS_LAST_BACKUP = 'xy_last_backup'; // 上次匯出備份的時間
const LS_BACKUP_SNOOZE = 'xy_backup_snooze'; // 暫時不再提醒到某時間
let db;

/* ---------- 分類 ---------- */
const DEFAULT_CATS = ['心情','日常','旅行','工作','靈感'];
const CAT_META = {'心情':'#C98BA0','日常':'#8BA88E','旅行':'#7FA0C4','工作':'#C2A06B','靈感':'#8E86C4'};
const CAT_PALETTE = ['#C98BA0','#8BA88E','#7FA0C4','#C2A06B','#8E86C4','#B58BC9','#7FB3B0','#C98B7F'];
let editorCategory = '';   // 撰寫中選取的分類
let catFilter = '';        // Feed 依分類篩選（''=全部）
function customCats(){ try{ return JSON.parse(localStorage.getItem(LS_CATS)||'[]'); }catch(e){ return []; } }
function saveCustomCats(arr){ try{ localStorage.setItem(LS_CATS, JSON.stringify(arr)); }catch(e){} }
function allCats(){ const c=customCats(); return [...DEFAULT_CATS, ...c.filter(x=>!DEFAULT_CATS.includes(x))]; }
function catColor(name){
  if(!name) return 'var(--faint)';
  if(CAT_META[name]) return CAT_META[name];
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return CAT_PALETTE[h % CAT_PALETTE.length];
}

/* ---------- 小工具 ---------- */
const $  = (s)=>document.querySelector(s);
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const liveUrls = new Set();
function objURL(blob){ const u = URL.createObjectURL(blob); liveUrls.add(u); return u; }
function revokeFeedUrls(){ liveUrls.forEach(u=>URL.revokeObjectURL(u)); liveUrls.clear(); }

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- IndexedDB ---------- */
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('posts')) d.createObjectStore('posts',{keyPath:'id'});
      if(!d.objectStoreNames.contains('draft')) d.createObjectStore('draft',{keyPath:'key'});
    };
    r.onsuccess = e=>res(e.target.result);
    r.onerror   = e=>rej(e.target.error);
  });
}
function store(name,mode){ return db.transaction(name,mode).objectStore(name); }
function getAllPosts(){
  return new Promise((res,rej)=>{ const q=store('posts','readonly').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
}
function putPost(p){
  return new Promise((res,rej)=>{ const q=store('posts','readwrite').put(p); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
}
function deletePost(id){
  return new Promise((res,rej)=>{ const q=store('posts','readwrite').delete(id); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
}
function getPost(id){
  return new Promise((res,rej)=>{ const q=store('posts','readonly').get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
}
function saveDraftDB(obj){
  return new Promise((res,rej)=>{ const q=store('draft','readwrite').put({key:'current',...obj}); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
}
function getDraftDB(){
  return new Promise((res,rej)=>{ const q=store('draft','readonly').get('current'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
}
function clearDraftDB(){
  return new Promise((res,rej)=>{ const q=store('draft','readwrite').delete('current'); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
}

/* ---------- Markdown（輕量安全解析） ---------- */
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mdInline(s){
  s = s.replace(/`([^`]+)`/g, (m,c)=>`<code>${c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdToHtml(src){
  const lines = escapeHtml(src.replace(/\r\n/g,'\n')).split('\n');
  let html='', para=[], listType=null, listItems=[], inCode=false, codeBuf=[];
  const flushPara = ()=>{ if(para.length){ html += '<p>'+para.map(mdInline).join('<br>')+'</p>'; para=[]; } };
  const flushList = ()=>{ if(listType){ html += `<${listType}>`+listItems.map(li=>`<li>${mdInline(li)}</li>`).join('')+`</${listType}>`; listType=null; listItems=[]; } };
  for(const raw of lines){
    if(/^```/.test(raw)){
      if(inCode){ html += '<pre><code>'+codeBuf.join('\n')+'</code></pre>'; codeBuf=[]; inCode=false; }
      else { flushPara(); flushList(); inCode=true; }
      continue;
    }
    if(inCode){ codeBuf.push(raw); continue; }
    if(/^\s*$/.test(raw)){ flushPara(); flushList(); continue; }
    let h = raw.match(/^(#{1,4})\s+(.*)$/);
    if(h){ flushPara(); flushList(); const lv=Math.min(h[1].length+2,6); html+=`<h${lv}>${mdInline(h[2])}</h${lv}>`; continue; }
    if(/^\s*&gt;\s?/.test(raw)){ flushPara(); flushList(); html+='<blockquote>'+mdInline(raw.replace(/^\s*&gt;\s?/,''))+'</blockquote>'; continue; }
    if(/^\s*([-*])\s+/.test(raw)){ flushPara(); if(listType!=='ul'){ flushList(); listType='ul'; } listItems.push(raw.replace(/^\s*[-*]\s+/,'')); continue; }
    if(/^\s*\d+\.\s+/.test(raw)){ flushPara(); if(listType!=='ol'){ flushList(); listType='ol'; } listItems.push(raw.replace(/^\s*\d+\.\s+/,'')); continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(raw)){ flushPara(); flushList(); html+='<hr>'; continue; }
    para.push(raw);
  }
  flushPara(); flushList(); if(inCode){ html += '<pre><code>'+codeBuf.join('\n')+'</code></pre>'; }
  return html;
}

/* ---------- 日期格式 ---------- */
function fmtDate(ts){
  const d = new Date(ts);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}年${pad(d.getMonth()+1)}月${pad(d.getDate())}日`;
}
function fmtTime(ts){
  const d = new Date(ts); const pad=n=>String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function relTime(ts){
  const diff = (Date.now()-ts)/1000;
  if(diff < 60) return '剛剛';
  if(diff < 3600) return Math.floor(diff/60)+' 分鐘前';
  if(diff < 86400) return Math.floor(diff/3600)+' 小時前';
  if(diff < 86400*7) return Math.floor(diff/86400)+' 天前';
  return '';
}
function ymKey(ts){ const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function dayKey(ts){ const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* ---------- 媒體分類 ---------- */
function kindOf(type){
  if(type.startsWith('image/')) return 'image';
  if(type.startsWith('video/')) return 'video';
  if(type.startsWith('audio/')) return 'audio';
  return 'file';
}

/* ---------- 附件壓縮（手機照片動輒數 MB，壓縮後更省空間、更耐久） ---------- */
const IMG_MAXDIM = 1600;   // 長邊上限（手機觀看綽綽有餘）
const IMG_QUALITY = 0.82;
function supportsWebp(){
  try{ return document.createElement('canvas').toDataURL('image/webp').indexOf('image/webp')>0; }catch(e){ return false; }
}
function fmtBytes(n){
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(0)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
function renameExt(name, mime){
  const ext = mime==='image/webp' ? 'webp' : mime==='image/jpeg' ? 'jpg' : (name.split('.').pop()||'img');
  return name.replace(/\.[^.]+$/, '') + '.' + ext;
}
async function compressImage(file){
  // 只壓縮一般點陣圖；GIF（可能是動圖）與非圖片原樣保留
  if(!file.type.startsWith('image/') || file.type==='image/gif') return file;
  try{
    let src, w, h, bmp=null;
    if(self.createImageBitmap){
      bmp = await createImageBitmap(file, {imageOrientation:'from-image'}).catch(()=>createImageBitmap(file));
      src = bmp; w = bmp.width; h = bmp.height;
    }else{
      const url = URL.createObjectURL(file);
      const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
      src = img; w = img.naturalWidth; h = img.naturalHeight; URL.revokeObjectURL(url);
    }
    if(!w || !h) return file;
    const scale = Math.min(1, IMG_MAXDIM/Math.max(w,h));
    const nw = Math.round(w*scale), nh = Math.round(h*scale);
    const canvas = document.createElement('canvas'); canvas.width=nw; canvas.height=nh;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, 0, 0, nw, nh);
    if(bmp && bmp.close) bmp.close();
    const mime = supportsWebp() ? 'image/webp' : 'image/jpeg';
    const blob = await new Promise(res=>canvas.toBlob(res, mime, IMG_QUALITY));
    if(!blob) return file;
    return blob.size < file.size ? Object.assign(blob, {__mime:mime}) : file;
  }catch(e){ console.warn('圖片壓縮失敗，保留原檔', e); return file; }
}

/* =========================================================
   撰寫器狀態
   ========================================================= */
let editorMedia = [];   // [{id,name,type,kind,blob}]
let editingId = null;   // 若正在編輯既有貼文
const editorUrls = new Set();
function editorURL(blob){ const u=URL.createObjectURL(blob); editorUrls.add(u); return u; }
function clearEditorUrls(){ editorUrls.forEach(u=>URL.revokeObjectURL(u)); editorUrls.clear(); }

const editor = $('#editor');
const publishBtn = $('#publishBtn');

function autoGrow(){ editor.style.height='auto'; editor.style.height = Math.max(104, editor.scrollHeight)+'px'; }

function renderMediaStrip(){
  const strip = $('#mediaStrip'); strip.innerHTML='';
  clearEditorUrls();
  editorMedia.forEach(m=>{
    const div = document.createElement('div'); div.className='media-thumb';
    if(m.kind==='image'){ div.innerHTML = `<img src="${editorURL(m.blob)}" alt="">`; }
    else if(m.kind==='video'){ div.innerHTML = `<video src="${editorURL(m.blob)}" muted></video>`; }
    else { div.innerHTML = `<div class="file-badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><span>${m.name}</span></div>`; }
    const rm = document.createElement('button'); rm.className='rm'; rm.innerHTML='×'; rm.title='移除';
    rm.onclick=()=>{ editorMedia=editorMedia.filter(x=>x.id!==m.id); renderMediaStrip(); updatePublishState(); scheduleDraftSave(); };
    div.appendChild(rm); strip.appendChild(div);
  });
}

function updatePublishState(){
  const has = editor.value.trim().length>0 || editorMedia.length>0;
  publishBtn.disabled = !has;
  publishBtn.textContent = editingId ? '儲存修改' : '發布';
}

/* ---------- 分類選擇（撰寫器） ---------- */
function renderCatChoices(){
  const box = $('#catChoices'); if(!box) return;
  box.innerHTML='';
  allCats().forEach(name=>{
    const b=document.createElement('button'); b.type='button';
    b.className='cat-pill'+(editorCategory===name?' on':'');
    b.style.setProperty('--cc', catColor(name));
    b.innerHTML = `<i></i>${escapeHtml(name)}`;
    b.onclick=()=>{ editorCategory = (editorCategory===name?'':name); renderCatChoices(); scheduleDraftSave(); };
    box.appendChild(b);
  });
  const add=document.createElement('button'); add.type='button'; add.className='cat-pill add';
  add.textContent='＋ 新增'; add.title='新增自訂分類';
  add.onclick=addCategory;
  box.appendChild(add);
}
function addCategory(){
  const name=(prompt('新增一個分類名稱（例如：讀書、育兒、夢境）')||'').trim();
  if(!name) return;
  if(name.length>8){ toast('分類名稱請控制在 8 字以內'); return; }
  if(!allCats().includes(name)){ const c=customCats(); c.push(name); saveCustomCats(c); }
  editorCategory=name; renderCatChoices(); scheduleDraftSave();
}

/* ---------- 草稿自動暫存 ---------- */
let draftTimer;
function scheduleDraftSave(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraftNow, 400);
  // localStorage 即時鏡射文字（滿足「即時寫入」）
  try{ localStorage.setItem(LS_DRAFT_TEXT, editor.value); }catch(e){}
}
async function saveDraftNow(){
  if(editingId) return; // 編輯既有貼文時不覆寫草稿
  const content = editor.value;
  if(!content.trim() && editorMedia.length===0 && !editorCategory){ await clearDraftDB(); showDraftNote(''); return; }
  await saveDraftDB({ content, category:editorCategory, media: editorMedia.map(m=>({id:m.id,name:m.name,type:m.type,kind:m.kind,blob:m.blob})), updatedAt:Date.now() });
  showDraftNote(`草稿已暫存 · ${fmtTime(Date.now())}`);
}
function showDraftNote(txt){ const n=$('#draftNote'); n.innerHTML = txt ? `<b>●</b> ${txt}` : ''; }

async function restoreDraft(){
  const d = await getDraftDB();
  if(d && (d.content?.trim() || (d.media&&d.media.length))){
    editor.value = d.content||'';
    editorCategory = d.category||'';
    editorMedia = (d.media||[]).map(m=>({...m}));
    renderMediaStrip(); renderCatChoices(); autoGrow(); updatePublishState();
    showDraftNote('已回復上次未發布的草稿');
  }
}

/* ---------- 發布 / 儲存修改 ---------- */
async function publish(){
  const content = editor.value.trim();
  if(!content && editorMedia.length===0) return;
  const media = editorMedia.map(m=>({id:m.id,name:m.name,type:m.type,kind:m.kind,blob:m.blob}));
  if(editingId){
    const existing = await getPost(editingId);
    const updated = { ...existing, content, category:editorCategory, media, updatedAt:Date.now() };
    await putPost(updated);
    toast('已儲存修改');
  }else{
    await putPost({ id:uid(), content, category:editorCategory, media, createdAt:Date.now(), updatedAt:Date.now() });
    toast('已發布');
  }
  // 清空撰寫器與草稿
  editor.value=''; editorMedia=[]; editingId=null; editorCategory='';
  renderMediaStrip(); renderCatChoices(); autoGrow(); updatePublishState(); showDraftNote('');
  await clearDraftDB(); try{ localStorage.removeItem(LS_DRAFT_TEXT); }catch(e){}
  switchTab('write');
  await renderFeed();
  showView('journal');
  window.scrollTo({top:0,behavior:'smooth'});
  scheduleSync();
}

/* ---------- 編輯既有貼文 ---------- */
async function startEdit(id){
  const p = await getPost(id); if(!p) return;
  editingId = id;
  editor.value = p.content||'';
  editorCategory = p.category||'';
  editorMedia = (p.media||[]).map(m=>({...m}));
  renderMediaStrip(); renderCatChoices(); autoGrow(); updatePublishState(); switchTab('write');

/* =========================================================
   Feed 渲染
   ========================================================= */
let filterMode = 'all';   // 'all' | 'day' | 'month'
let filterValue = '';

async function renderFeed(){
  revokeFeedUrls();
  const feed = $('#feed');
  let posts = await getAllPosts();
  posts.sort((a,b)=> b.createdAt - a.createdAt);
  rebuildMonthOptions(posts);
  updateBackupNote(posts.length);

  renderCatbar(posts);

  let shown = posts;
  if(catFilter)            shown = shown.filter(p=>(p.category||'')===catFilter);
  if(filterMode==='day')   shown = shown.filter(p=>dayKey(p.createdAt)===filterValue);
  if(filterMode==='month') shown = shown.filter(p=>ymKey(p.createdAt)===filterValue);

  const anyFilter = filterMode!=='all' || !!catFilter;
  $('#filterCount').textContent = anyFilter
    ? `符合 ${shown.length} 則`
    : (posts.length ? `共 ${posts.length} 則紀錄` : '');
  $('#clearFilter').style.display = anyFilter ? '' : 'none';

  if(shown.length===0){
    feed.innerHTML = `<div class="empty-state">
      <div class="glyph">${posts.length? '⟡':'❋'}</div>
      <p>${posts.length? '這段時間還沒有紀錄':'還沒有任何隨筆'}</p>
      <p class="sub">${posts.length? '換個日期，或清除篩選看看全部':'在上方寫下第一則，讓時間開始流動'}</p>
    </div>`;
    return;
  }

  feed.innerHTML='';
  shown.forEach(p=>{
    const el = document.createElement('article'); el.className='post';
    const rel = relTime(p.createdAt);
    el.innerHTML = `
      <div class="post-head">
        <div class="post-head-left">
          <div class="post-date">
            <span>${fmtDate(p.createdAt)}</span>
            <span class="time">${fmtTime(p.createdAt)}${rel? ' · '+rel:''}</span>
          </div>
          ${p.category ? `<span class="post-cat" style="--cc:${catColor(p.category)}"><i></i>${escapeHtml(p.category)}</span>` : ''}
        </div>
        <div class="post-actions">
          <button data-act="edit" title="編輯"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button data-act="del" title="刪除"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
        </div>
      </div>
      ${p.content ? `<div class="post-body">${mdToHtml(p.content)}</div>` : ''}
    `;
    // 媒體
    if(p.media && p.media.length){
      const visuals = p.media.filter(m=> m.kind==='image' || m.kind==='video');
      const others  = p.media.filter(m=> m.kind!=='image' && m.kind!=='video');

      // 圖片＋影片：橫向底片條，可左右滑動瀏覽
      if(visuals.length){
        const wrap = document.createElement('div');
        wrap.className = 'post-media' + (visuals.length===1 ? ' single':'');
        const imgUrls = [];   // 同一則的所有圖片，供相簿式左右瀏覽
        visuals.forEach(m=>{
          const fig = document.createElement('figure');
          const url = objURL(m.blob);
          if(m.kind==='image'){
            const idx = imgUrls.length; imgUrls.push(url);
            const img=document.createElement('img'); img.src=url; img.alt=m.name||''; img.loading='lazy';
            img.onclick=()=>openLightbox(imgUrls, idx); fig.appendChild(img);
          }else{ // video
            const v=document.createElement('video'); v.src=url; v.controls=true; v.preload='metadata'; v.playsInline=true; fig.appendChild(v);
          }
          wrap.appendChild(fig);
        });
        el.appendChild(wrap);
      }

      // 音檔與其他檔案：縱向列出
      if(others.length){
        const fwrap = document.createElement('div'); fwrap.className='post-files';
        others.forEach(m=>{
          const url = objURL(m.blob);
          if(m.kind==='audio'){
            const a=document.createElement('audio'); a.src=url; a.controls=true; fwrap.appendChild(a);
          }else{
            const link=document.createElement('a'); link.className='file-link'; link.href=url; link.download=m.name||'file';
            link.innerHTML=`<svg viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><span>${m.name||'附件'}</span>`;
            fwrap.appendChild(link);
          }
        });
        el.appendChild(fwrap);
      }
    }
    // 操作
    el.querySelector('[data-act="edit"]').onclick = ()=>startEdit(p.id);
    el.querySelector('[data-act="del"]').onclick = async ()=>{
      if(confirm('確定要刪除這則紀錄嗎？此動作無法復原。')){
        addTombstone(p.id); await deletePost(p.id); toast('已刪除'); await renderFeed(); scheduleSync();
      }
    };
    feed.appendChild(el);
  });
}

function rebuildMonthOptions(posts){
  const sel = $('#monthFilter');

function renderCatbar(posts){

  allCats().forEach(name=>{ if(counts[name] || DEFAULT_CATS.includes(name)) chip(name, name, catColor(name), counts[name]||0); });

/* ============================================================
   Google 雲端硬碟同步（存放於 App 專屬隱藏資料夾 appDataFolder）
   本機 IndexedDB 為主，雲端為同步副本；合併採「同 id 取較新」+ 刪除墓碑
   ============================================================ */
const G_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const LS_GCLIENT = 'xy_g_client_id';
const LS_GCONNECTED = 'xy_g_connected';
const LS_SYNC_LAST = 'xy_sync_last';
const LS_MANIFEST_ID = 'xy_manifest_fileid';
const LS_TOMB = 'xy_tombstones';
let gTokenClient=null, gToken=null, gTokenExp=0, syncing=false, syncTimer=null;

function getTombstones(){ try{ return JSON.parse(localStorage.getItem(LS_TOMB)||'[]'); }catch(e){ return []; } }
function saveTombstones(a){ try{ localStorage.setItem(LS_TOMB, JSON.stringify(a)); }catch(e){} }
function addTombstone(id){ const a=getTombstones().filter(t=>t.id!==id); a.push({id, at:Date.now()}); saveTombstones(a); }
function isConnected(){ return !!localStorage.getItem(LS_GCLIENT) && localStorage.getItem(LS_GCONNECTED)==='1'; }

function gInitTokenClient(){
  const cid = localStorage.getItem(LS_GCLIENT);
  if(!cid) return false;
  if(!(window.google && google.accounts && google.accounts.oauth2)) return false;
  gTokenClient = google.accounts.oauth2.initTokenClient({ client_id:cid, scope:G_SCOPE, callback:()=>{} });
  return true;
}
function gGetToken(interactive){
  return new Promise((resolve,reject)=>{
    if(gToken && Date.now() < gTokenExp-60000){ resolve(gToken); return; }
    if(!gTokenClient && !gInitTokenClient()){ reject(new Error('尚未設定金鑰或 Google 元件未載入')); return; }
    gTokenClient.callback = (resp)=>{
      if(resp && resp.error){ reject(new Error(resp.error)); return; }
      gToken = resp.access_token; gTokenExp = Date.now() + (resp.expires_in||3600)*1000;
      resolve(gToken);
    };
    try{ gTokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' }); }
    catch(e){ reject(e); }
  });
}

/* --- Drive REST --- */
async function driveFindManifest(token){
  const q = encodeURIComponent("name='manifest.json'");
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`,
    { headers:{ Authorization:'Bearer '+token } });
  if(!r.ok) throw new Error('讀取清單失敗 '+r.status);
  const j = await r.json();
  if(j.files && j.files.length){ localStorage.setItem(LS_MANIFEST_ID, j.files[0].id); return j.files[0].id; }
  localStorage.removeItem(LS_MANIFEST_ID); return null;
}
async function driveGetJson(token, id){
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers:{ Authorization:'Bearer '+token } });
  if(!r.ok) throw new Error('下載清單失敗 '+r.status);
  return await r.json();
}
async function driveGetBlob(token, id){
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers:{ Authorization:'Bearer '+token } });
  if(!r.ok) throw new Error('下載附件失敗 '+r.status);
  return await r.blob();
}
async function driveUploadBlob(token, blob, label){
  const boundary = '----xy'+Math.random().toString(36).slice(2);
  const meta = { name:'media_'+label, parents:['appDataFolder'] };
  const body = new Blob([
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`, JSON.stringify(meta),
    `\r\n--${boundary}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`, blob,
    `\r\n--${boundary}--`
  ]);
  const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    { method:'POST', headers:{ Authorization:'Bearer '+token, 'Content-Type':'multipart/related; boundary='+boundary }, body });
  if(!r.ok) throw new Error('上傳附件失敗 '+r.status);
  return (await r.json()).id;
}
async function drivePutManifest(token, manifest){
  const content = JSON.stringify(manifest);
  let id = localStorage.getItem(LS_MANIFEST_ID);
  if(id){
    const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
      { method:'PATCH', headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' }, body:content });
    if(r.ok) return id;
  }
  const boundary = '----xy'+Math.random().toString(36).slice(2);
  const meta = { name:'manifest.json', parents:['appDataFolder'] };
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const r2 = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    { method:'POST', headers:{ Authorization:'Bearer '+token, 'Content-Type':'multipart/related; boundary='+boundary }, body });
  if(!r2.ok) throw new Error('寫入清單失敗 '+r2.status);
  const nid = (await r2.json()).id; localStorage.setItem(LS_MANIFEST_ID, nid); return nid;
}

/* --- 拉取：雲端 → 本機 --- */
async function syncPull(token){
  const mid = await driveFindManifest(token);
  if(!mid) return;
  const remote = await driveGetJson(token, mid);
  const local = await getAllPosts();
  const localById = new Map(local.map(p=>[p.id,p]));
  const tomb = new Map(getTombstones().map(t=>[t.id, t.at]));
  (remote.tombstones||[]).forEach(t=> tomb.set(t.id, Math.max(tomb.get(t.id)||0, t.at)) );

  for(const rp of (remote.posts||[])){
    const lp = localById.get(rp.id);
    if(lp && (lp.updatedAt||0) >= (rp.updatedAt||0)) continue;   // 本機較新，跳過
    const media = [];
    for(const rm of (rp.media||[])){
      const keep = lp && (lp.media||[]).find(x=> x.id===rm.id && x.blob);
      let blob = keep ? keep.blob : (rm.driveId ? await driveGetBlob(token, rm.driveId) : null);
      media.push({ id:rm.id, name:rm.name, type:rm.type, kind:rm.kind, driveId:rm.driveId, blob });
    }
    await putPost({ id:rp.id, content:rp.content, category:rp.category||'', createdAt:rp.createdAt, updatedAt:rp.updatedAt, media });
  }
  // 套用刪除墓碑：本機該則沒有比墓碑更新，就刪掉
  for(const [id,at] of tomb){
    const lp = await getPost(id);
    if(lp && at >= (lp.updatedAt||0)) await deletePost(id);
  }
  saveTombstones([...tomb].map(([id,at])=>({id,at})));
}

/* --- 推送：本機 → 雲端 --- */
async function syncPush(token){
  const posts = await getAllPosts();
  for(const p of posts){
    let changed=false;
    for(const m of (p.media||[])){
      if(!m.driveId && m.blob){ m.driveId = await driveUploadBlob(token, m.blob, m.id); changed=true; }
    }
    if(changed) await putPost(p);
  }
  const manifest = {
    schema:2, updatedAt:Date.now(),
    posts: posts.map(p=>({ id:p.id, content:p.content||'', category:p.category||'',
      createdAt:p.createdAt, updatedAt:p.updatedAt||p.createdAt,
      media:(p.media||[]).map(m=>({ id:m.id, name:m.name, type:m.type, kind:m.kind, driveId:m.driveId })) })),
    tombstones: getTombstones()
  };
  await drivePutManifest(token, manifest);
}

/* --- 完整同步 --- */
async function fullSync(interactive){
  if(syncing) return;
  if(!localStorage.getItem(LS_GCLIENT)){ if(interactive) openSyncModal(); return; }
  syncing = true; setSyncDot('syncing');
  try{
    const token = await gGetToken(interactive);
    localStorage.setItem(LS_GCONNECTED,'1');
    await syncPull(token);
    await syncPush(token);
    localStorage.setItem(LS_SYNC_LAST, String(Date.now()));
    await renderFeed();
    setSyncDot('on'); updateSyncModal();
    if(interactive) toast('已與 Google 雲端硬碟同步');
  }catch(err){
    console.error('同步失敗', err); setSyncDot('err');
    if(interactive) toast('同步失敗：'+(err.message||'請稍後再試'));
  }finally{ syncing=false; }
}
function scheduleSync(){ if(!isConnected()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>fullSync(false), 3500); }

/* --- UI --- */
function setSyncDot(state){
  const d = $('#syncDot'); if(!d) return;
  d.className = 'sync-dot' + (state?(' '+state):'');
}
function fmtSyncTime(ms){
  if(!ms) return '';
  const diff = Date.now()-ms;
  if(diff < 60000) return '剛剛';
  if(diff < 3600000) return Math.floor(diff/60000)+' 分鐘前';
  const d=new Date(ms), pad=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function updateSyncModal(){
  const connected = isConnected();
  $('#syncConnectRow').hidden = connected;
  $('#syncConnectedRow').hidden = !connected;
  $('#syncStatusText').textContent = connected
    ? '已連結。日記會自動同步到你自己的 Google 雲端硬碟，手機和電腦互通。'
    : '連結後，日記會自動同步到你自己的 Google 雲端硬碟，手機和電腦就能互通。';
  const last = parseInt(localStorage.getItem(LS_SYNC_LAST)||'0');
  $('#syncLastText').textContent = last ? ('上次同步：'+fmtSyncTime(last)) : '';
  const cid = localStorage.getItem(LS_GCLIENT)||'';
  const input = $('#gClientInput'); if(input && !input.value) input.value = cid;
  if(!cid){ $('#syncAdv').open = true; }
}
function openSyncModal(){ updateSyncModal(); $('#syncModal').hidden=false; }
function closeSyncModal(){ $('#syncModal').hidden=true; }

function bindSync(){
  $('#syncBtn').addEventListener('click', openSyncModal);
  $('#syncModalClose').addEventListener('click', closeSyncModal);
  $('#syncModal').addEventListener('click', e=>{ if(e.target.id==='syncModal') closeSyncModal(); });
  $('#syncConnectBtn').addEventListener('click', ()=>{
    if(!localStorage.getItem(LS_GCLIENT)){ $('#syncAdv').open=true; toast('請先填入金鑰（見進階設定）'); return; }
    fullSync(true);
  });
  $('#syncNowBtn').addEventListener('click', ()=>fullSync(true));
  $('#syncDisconnectBtn').addEventListener('click', ()=>{
    localStorage.removeItem(LS_GCONNECTED); localStorage.removeItem(LS_SYNC_LAST);
    gToken=null; gTokenExp=0; setSyncDot(''); updateSyncModal(); toast('已中斷連結（本機日記仍保留）');
  });
  $('#gClientSave').addEventListener('click', ()=>{
    const v = $('#gClientInput').value.trim();
    if(!v){ toast('請貼上 Client ID'); return; }
    localStorage.setItem(LS_GCLIENT, v); gTokenClient=null; gInitTokenClient();
    updateSyncModal(); toast('金鑰已儲存，可以按「連結」了');
  });
  // 啟動時若已連結，靜默同步一次
  if(isConnected()){ setSyncDot('on'); setTimeout(()=>fullSync(false), 1200); }
  else setSyncDot('');
}

/* ---------- Lightbox ---------- */
let lbImages = [], lbIndex = 0;
function openLightbox(images, index){
  lbImages = Array.isArray(images) ? images : [images];
  lbIndex = index || 0;
  renderLightbox();
  $('#lightbox').classList.add('show');
}
function renderLightbox(){
  $('#lightboxImg').src = lbImages[lbIndex];
  const multi = lbImages.length > 1;
  const c = $('#lbCounter'); c.textContent = multi ? `${lbIndex+1} / ${lbImages.length}` : ''; c.style.display = multi ? '' : 'none';
  $('#lbPrev').style.display = multi ? '' : 'none';
  $('#lbNext').style.display = multi ? '' : 'none';
}
function lbShow(delta){
  if(lbImages.length < 2) return;
  lbIndex = (lbIndex + delta + lbImages.length) % lbImages.length;
  renderLightbox();
}
function closeLightbox(){ $('#lightbox').classList.remove('show'); }

(function bindLightbox(){
  const lb = $('#lightbox');
  $('#lbBack').addEventListener('click', e=>{ e.stopPropagation(); closeLightbox(); });
  $('#lbClose').addEventListener('click', e=>{ e.stopPropagation(); closeLightbox(); });
  $('#lbPrev').addEventListener('click', e=>{ e.stopPropagation(); lbShow(-1); });
  $('#lbNext').addEventListener('click', e=>{ e.stopPropagation(); lbShow(1); });
  // 左右滑動切換；單純點擊（照片或背景）則關閉
  let sx=null, sy=null, swiped=false;
  lb.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; swiped=false; }, {passive:true});
  lb.addEventListener('touchend', e=>{
    if(sx==null) return;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){ swiped=true; lbShow(dx<0?1:-1); }
    sx=null;
  }, {passive:true});
  lb.addEventListener('click', e=>{
    if(swiped){ swiped=false; return; }
    if(e.target.closest('.lb-nav') || e.target.closest('.lb-close') || e.target.closest('.lb-back')) return;
    closeLightbox();
  });
})();

/* =========================================================
   匯出 / 匯入
   ========================================================= */
function blobToDataURL(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });
}
function dataURLtoBlob(dataURL){
  const [meta,b64] = dataURL.split(',');
  const mime = (meta.match(/data:([^;]+)/)||[])[1] || 'application/octet-stream';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function exportData(){
  const posts = await getAllPosts();
  if(posts.length===0){ toast('目前沒有可匯出的資料'); return; }
  toast('正在打包備份…');
  const out=[];
  for(const p of posts){
    const media=[];
    for(const m of (p.media||[])){
      media.push({ id:m.id, name:m.name, type:m.type, kind:m.kind, data: await blobToDataURL(m.blob) });
    }
    out.push({ id:p.id, content:p.content, category:p.category||'', createdAt:p.createdAt, updatedAt:p.updatedAt, media });
  }
  const payload = { app:'心映隨筆', schema:1, exportedAt:Date.now(), count:out.length, posts:out };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const d=new Date(); const pad=n=>String(n).padStart(2,'0');
  const fname = `心映隨筆_備份_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;

  const markDone = ()=>{
    try{ localStorage.setItem(LS_LAST_BACKUP, String(Date.now())); localStorage.removeItem(LS_BACKUP_SNOOZE); }catch(e){}
    $('#backupNote').hidden = true;
  };

  // 優先：手機原生「分享」— 可直接存到 iCloud 雲端硬碟，或傳給自己的 LINE／email
  let file = null;
  try{ file = new File([blob], fname, {type:'application/json'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({ files:[file], title:'心映隨筆備份', text:'心映隨筆 日記備份' });
      markDone();
      toast('已開啟分享，可存到 iCloud 或傳給自己');
      return;
    }catch(err){
      if(err && err.name==='AbortError'){ toast('已取消備份'); return; }
      // 其他狀況 → 改用下載
    }
  }

  // 退回：直接下載檔案（電腦、或不支援分享的環境）
  const a=document.createElement('a');
  a.download = fname;
  a.href = URL.createObjectURL(blob); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  markDone();
  toast(`已匯出 ${out.length} 則紀錄`);
}

/* ---------- 備份提醒（服務「想用很久」的目標） ---------- */
function updateBackupNote(count){
  const note = $('#backupNote'); if(!note) return;
  if(!count){ note.hidden = true; return; }
  const snooze = parseInt(localStorage.getItem(LS_BACKUP_SNOOZE)||'0');
  if(Date.now() < snooze){ note.hidden = true; return; }
  const last = parseInt(localStorage.getItem(LS_LAST_BACKUP)||'0');
  const days = last ? Math.floor((Date.now()-last)/86400000) : -1;
  if(last && days < 14){ note.hidden = true; return; }
  $('#backupNoteText').textContent = last
    ? `距離上次備份已 ${days} 天了，按一下就能存到 iCloud 或傳給自己。`
    : `你的日記目前只存在這支手機裡。按「立即備份」可存到 iCloud 雲端硬碟，換手機也不怕遺失。`;
  note.hidden = false;
}
async function importData(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const posts = data.posts || (Array.isArray(data)? data : null);
    if(!posts) throw new Error('格式不符');
    const existing = new Set((await getAllPosts()).map(p=>p.id));
    let added=0;
    for(const p of posts){
      if(existing.has(p.id)) continue; // 跳過重複
      const media = (p.media||[]).map(m=>({
        id:m.id||uid(), name:m.name, type:m.type, kind:m.kind || kindOf(m.type||''),
        blob: m.data ? dataURLtoBlob(m.data) : m.blob
      }));
      await putPost({ id:p.id||uid(), content:p.content||'', category:p.category||'', createdAt:p.createdAt||Date.now(), updatedAt:p.updatedAt||p.createdAt||Date.now(), media });
      // 匯入時若含自訂分類，一併補回清單
      if(p.category && !allCats().includes(p.category)){ const c=customCats(); c.push(p.category); saveCustomCats(c); }
      added++;
    }
    renderCatChoices();
    await renderFeed();
    toast(added? `已匯入 ${added} 則紀錄`:'沒有新的紀錄（可能已存在）');
  }catch(err){
    console.error(err); toast('匯入失敗：檔案格式無法辨識');
  }
}

/* =========================================================
   主題
   ========================================================= */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const icon = $('#themeIcon');
  if(t==='dark'){ icon.innerHTML = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>'; }
  else{ icon.innerHTML = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'; }
  try{ localStorage.setItem(LS_THEME, t); }catch(e){}
}

/* =========================================================
   事件綁定
   ========================================================= */
function switchTab(which){
  const write = which==='write';
  $('#tabWrite').classList.toggle('active', write);
  $('#tabPreview').classList.toggle('active', !write);
  editor.style.display = write ? '' : 'none';
  const pv = $('#preview'); pv.style.display = write ? 'none' : '';
  if(!write){
    const val = editor.value.trim();
    pv.classList.toggle('empty', !val);
    pv.innerHTML = val ? mdToHtml(editor.value) : '這裡會顯示 Markdown 預覽…';
  }
}

/* ---------- 頁面路由（撰寫頁 / 日記頁） ---------- */
function showView(v){
  const write = v==='write';
  $('#page-write').classList.toggle('active', write);
  $('#page-journal').classList.toggle('active', !write);
  if(location.hash.slice(1)!==v){ location.hash = v; }
  window.scrollTo({top:0, behavior:'auto'});
  if(write) setTimeout(()=>{ try{ editor.focus(); }catch(e){} }, 60);
}
function routeFromHash(){
  const v = location.hash.slice(1)==='write' ? 'write' : 'journal';
  showView(v);
}

/* 若正在編輯既有紀錄，離開撰寫頁時視為取消，回復原本草稿 */
async function resetEditIfAny(){
  if(!editingId) return;
  editingId=null; editor.value=''; editorMedia=[]; editorCategory='';
  renderMediaStrip(); renderCatChoices(); autoGrow(); await restoreDraft(); updatePublishState();
}
async function goWriteNew(){ await resetEditIfAny(); showView('write'); }
async function goJournal(){ await resetEditIfAny(); showView('journal'); }

function bindEvents(){
  editor.addEventListener('input', ()=>{ autoGrow(); updatePublishState(); scheduleDraftSave(); });
  $('#fileInput').addEventListener('change', async e=>{
    const files = [...e.target.files]; e.target.value='';
    if(!files.length) return;
    const hasImg = files.some(f=>f.type.startsWith('image/') && f.type!=='image/gif');
    if(hasImg) showDraftNote('正在壓縮圖片…');
    let saved=0, imgN=0;
    for(const f of files){
      let blob=f, name=f.name, type=f.type||'application/octet-stream';
      if(type.startsWith('image/') && type!=='image/gif'){
        const c = await compressImage(f);
        if(c!==f){ saved += (f.size - c.size); imgN++; blob=c; type=c.__mime||type; name=renameExt(name,type); }
      }
      editorMedia.push({ id:uid(), name, type, kind:kindOf(type), blob });
    }
    renderMediaStrip(); updatePublishState(); scheduleDraftSave();
    if(imgN>0 && saved>0){ toast(`已壓縮 ${imgN} 張圖片 · 省下 ${fmtBytes(saved)}`); showDraftNote(''); }
    else showDraftNote('');
  });
  publishBtn.addEventListener('click', publish);
  $('#tabWrite').addEventListener('click', ()=>switchTab('write'));
  $('#tabPreview').addEventListener('click', ()=>switchTab('preview'));

  // 頁面切換：浮動鈕進入撰寫、返回鈕與品牌回日記
  $('#brandHome').addEventListener('click', goJournal);
  $('#backToJournal').addEventListener('click', goJournal);
  $('#fabWrite').addEventListener('click', goWriteNew);
  window.addEventListener('hashchange', routeFromHash);

  // 浮動鈕隨捲動自動隱藏／顯示（往下捲隱藏、往上捲或停住顯示）
  let lastY = window.scrollY;
  window.addEventListener('scroll', ()=>{
    const y = window.scrollY, fab = $('#fabWrite');
    if(y > lastY + 6 && y > 120) fab.classList.add('hidden');
    else if(y < lastY - 6) fab.classList.remove('hidden');
    lastY = y;
  }, {passive:true});

  $('#dateFilter').addEventListener('change', e=>{
    if(e.target.value){ filterMode='day'; filterValue=e.target.value; $('#monthFilter').value=''; }
    else { filterMode='all'; filterValue=''; }
    renderFeed();
  });
  $('#monthFilter').addEventListener('change', e=>{
    if(e.target.value){ filterMode='month'; filterValue=e.target.value; $('#dateFilter').value=''; }
    else { filterMode='all'; filterValue=''; }
    renderFeed();
  });
  $('#clearFilter').addEventListener('click', ()=>{
    filterMode='all'; filterValue=''; catFilter='';
    $('#dateFilter').value=''; $('#monthFilter').value=''; renderFeed();
  });

  $('#exportBtn').addEventListener('click', exportData);
  $('#backupNow').addEventListener('click', exportData);
  $('#backupSnooze').addEventListener('click', ()=>{
    try{ localStorage.setItem(LS_BACKUP_SNOOZE, String(Date.now()+7*86400000)); }catch(e){}
    $('#backupNote').hidden = true;
  });
  $('#importBtn').addEventListener('click', ()=>$('#importInput').click());
  $('#importInput').addEventListener('change', e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
  $('#themeBtn').addEventListener('click', ()=>{
    const now = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    applyTheme(now);
  });
  window.addEventListener('keydown', e=>{
    if(!$('#lightbox').classList.contains('show')) return;
    if(e.key==='Escape') closeLightbox();
    else if(e.key==='ArrowLeft') lbShow(-1);
    else if(e.key==='ArrowRight') lbShow(1);
  });
  // 離開前保存草稿
  window.addEventListener('beforeunload', ()=>{ if(!editingId) saveDraftNow(); });
}

/* =========================================================
   啟動
   ========================================================= */
(async function init(){
  // 請求「持久化儲存」，降低瀏覽器在空間不足時清掉日記的機率
  try{
    if(navigator.storage && navigator.storage.persist){
      const already = await navigator.storage.persisted();
      if(!already) await navigator.storage.persist();
    }
  }catch(e){}
  // 動態注入 PWA manifest（讓 Android/Chrome 可安裝成 App）
  try{
    const icon = document.querySelector('link[rel="apple-touch-icon"]').href;
    const manifest = { name:'心映隨筆', short_name:'心映隨筆', start_url:'./', scope:'./',
      display:'standalone', background_color:'#EDECEA', theme_color:'#6E6FA0',
      icons:[{ src:icon, sizes:'512x512', type:'image/png', purpose:'any maskable' }] };
    const link = document.createElement('link'); link.rel='manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    document.head.appendChild(link);
  }catch(e){}

  // 主題（優先讀取偏好，否則跟隨系統）
  let t = null; try{ t = localStorage.getItem(LS_THEME); }catch(e){}
  if(!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark':'light';
  applyTheme(t);

  try{
    db = await openDB();
  }catch(err){
    console.error(err);
    document.querySelector('.wrap').innerHTML = '<p style="text-align:center;padding:60px 20px;color:var(--muted)">此瀏覽器無法使用本機儲存（IndexedDB），可能處於無痕模式。請改用一般視窗開啟。</p>';
    return;
  }

  bindEvents();
  autoGrow();
  renderCatChoices();
  await restoreDraft();
  updatePublishState();
  await renderFeed();
  routeFromHash();
  bindSync();
})();
</script>
